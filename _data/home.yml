project_entries:
  - project_description: Catalogues with ORB contain orbital parameters and STEL contain stellar parameters.
  
  - title: MSC
    url: https://www.ctio.noirlab.edu/~atokovin/stars/
    desc: This is a catalog of hierarchical multiple stellar systems with three or more components. 
    highlight: STEL-ORB

  - title: WDS
    url: https://www.astro.gsu.edu/wds/
    desc: The Washington Double Star Catalog (WDS) maintained by the United States Naval Observatory is the world's principal database of astrometric double and multiple star information.
    highlight: ORB

  - title: SBX
    url: https://www.astro.ulb.ac.be/sbx
    desc: SBX originated from the migration of the SB9 catalogue. It continues the series of compilations of spectroscopic orbits carried out over the past 35 years by Batten and collaborators.
    highlight: ORB

  - title: DEBCat
    url: https://www.astro.keele.ac.uk/jkt/debcat/
    desc: DEBCat is a catalogue of the physical properties of well-studied detached eclipsing binaries. 
    highlight: STEL-ORB

  - title: PMTCat
    url: https://binary-observations.github.io/post_mt_catalog/
    desc: A collaborative project to catalog and analyze post-mass transfer binary systems.
    highlight: STEL-ORB

  - title: KeplerEB
    url: https://keplerebs.villanova.edu/
    desc: Kepler Eclipsing Binaries Catalog is a comprehensive, growing database of eclipsing binary star systems identified by the Kepler mission.
    highlight: ORB

  - title: TESSEB
    url: https://keplerebs.villanova.edu/
    desc: The TESS Eclipsing Binary Catalog is a comprehensive, growing database of eclipsing binary star systems identified by the Transiting Exoplanet Survey Satellite mission.
    highlight: ORB

old_project_entries:
  - project_description: LC - light curve. RV - radial velocity. AS - astrometry. LPV - line profile variations. 

#primary function: lightcurve model
  - title: PHOEBE2
    url: https://phoebe-project.org/
    desc: PHOEBE is an eclipsing binary modeling code that uses meshes to model stellar surfaces.
    highlight: LC-RV-LPV

  - title: JKTEBOP
    url: https://www.astro.keele.ac.uk/jkt/codes/jktebop.html
    desc: The code models the projection of each star as a sphere for calculating eclipse shapes and as a biaxial ellipsoid for calculating proximity effects.
    highlight: LC-RV


  - title: ALLESFITTER
    url: https://www.allesfitter.com/
    desc: Allesfitter is a public and user-friendly astronomy software package for modeling photometric and RV data. It can accommodate multiple exoplanets, multi-star systems, star spots, stellar flares, and various noise models. 
    highlight: LC-RV



    #primary function: orbit model
  - title: RadVel
    url: https://radvel.readthedocs.io/en/latest/
    desc: RadVel is an open-source Python package for modeling Keplerian orbits in radial velocity (RV) timeseries.
    highlight: RV

  - title: jaxoplanet
    url: https://jax.exoplanet.codes/en/latest/
    desc: jaxoplanet is a functional-programming-forward implementation of lightcurves, RVs, and relative astrometry of multi-exoplanet and star systems.
    highlight: LC-RV-AS

  - title: orbitize!
    url: https://orbitize.readthedocs.io/en/latest/
    desc: Python package for fitting orbits of directly imaged mulit-planet and star systems.
    highlight: AS

  - title: Octofitter
    url: https://sefffal.github.io/Octofitter.jl/stable/
    desc: Octofitter is a Julia package for performing Bayesian inference against a wide variety of exoplanet / binary star data. 
    highlight: RV-AS

  - title: orvara
    url: https://github.com/t-brandt/orvara
    desc: A package for fitting orbits of bright stars and their faint companions (exoplanets, brown dwarfs, white dwarfs, and low-mass stars).
    highlight: AS

  - title: REBOUND
    url: https://rebound.hanno-rein.de/
    desc: REBOUND is an N-body integrator, i.e. a software package that can integrate the motion of particles under the influence of gravity. 


  - title: REBOUNDx
    url: https://reboundx.readthedocs.io/en/latest/
    desc: REBOUNDx (eXtras) allows you to easily incorporate additional physics into your REBOUND N-body integrations.





